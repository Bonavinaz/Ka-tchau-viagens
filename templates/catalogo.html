<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Ka-Tchau Viagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="search-container">
      <a href="/" class="me-4">
        <img src="{{ url_for('static', filename='imagens/Sem título.png') }}" style="height:90px; width: auto;" alt="Logo Ka-Tchau Viagens" class="logo">
      </a>
      <!-- login -->
      <div>
        <button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Login</button>
        <div id="id01" class="modal"> 
          <form class="" action="/action_page.php" method="post">
            <div>
              <label for="nome"><b>Usuario</b></label>
              <input type="text" name="nome" required>
              <label for="senha"><b>Senha</b></label>
              <input type="password" name="senha" required>
              <button type="submit">Login</button>
            </div>
            <div>
            <button class="btn-cancel" type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
            <a href="/cadastro">cadastro</a>
            </div>
          </form>
        </div>
        <script>
          window.onclick = function(event) {
            if (event.target.id === 'id01') {
              event.target.style.display = "none";
            }
          }
        </script>
      </div>
  </header>
  <div class="search-logo">
      <div class="text-center my-4">
        <h1>Catálogo de Carros</h1>
        <p>Encontre o carro perfeito para sua próxima viagem!</p>
      </div>
      </div>
  </div>
      <select class="filtro-carros form-select mx-auto" aria-label="Default select example">
  <option selected>Filtre os Carros</option>
  <option value="1">Populares</option>
  <option value="2">SUV</option>
  <option value="3">Caminhonetes</option>
  <option value="4">Esportivos</option>
  <option value="5">Luxo</option>
  <option value="6">Superesportivos de Luxo</option>
      </select>
  
  <section class="categoria">
    <div style="display: flex; justify-content: flex-start;">
      <h2 class="ms-3 mt-4">Todos os carros</h2>
    </div>
    <div class="row row-cols-1 row-cols-md-3 g-4 my-2 distancia-cards">
    {% for carro in carros %}
      <div class="col">
          <div class="card h-100 custom-card">
            <div class="card-imagem">
              <img src="{{ url_for('static', filename='imagens/' + carro['imagem']) }}" class="w-100" alt="{{ carro['marca'] }}">
            </div>
            <div class="card-body">
              <div class="mb-2">
                <h5 class="card-title">{{ carro['marca'] }}</h5>
                <p class="card-text">{{ carro['descricao'] }}</p>
              </div>
              <a href="#" class="btn btn-danger">Quero alugar</a>
            </div>
          </div>
        </div>
    {% endfor %}
  
      </div>
    </div>
  </div>
</div>
</div>
    
  </section>
</body>
</html>
